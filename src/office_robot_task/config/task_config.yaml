home:            [-3.0, -4.0, 0.0]
delivery_point:  [1.0, -3.5, 0.0]
# 送达点：垃圾箱 (3,-4) 西北侧约 2 米处
# 配送路线：北侧走廊 -> x=1.5 的两桌间隙 -> 南下 -> 送达点
delivery_route:
  - [1.5, 3.0, -1.5708]
  - [1.5, -3.0, 0.0]
  - [1.0, -3.5, 0.0]
# 回程走底部走廊：送达点 -> 底部 -> 起点
return_route:
  - [1.0, -4.0, 0.0]
  - [-3.0, -4.0, 0.0]
pickup_points:
  cardboard_box: [-3.0, 3.0, -1.5708]
  wooden_board:  [0.0, 3.0, -1.5708]
  coke_can:      [3.0, 3.0, -1.5708]
patrol_points:
  - [-3.0, 3.0, -1.5708]
  - [0.0, 3.0, -1.5708]
  - [3.0, 3.0, -1.5708]
pick_duration: 2.0
place_duration: 2.0
patrol_wait: 6.0
nav_timeout: 150.0
auto_start_delay: 3.0
detect_confirm_frames: 3
detect_window: 8.0
