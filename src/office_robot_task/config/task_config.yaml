home:            [-3.0, -4.0, 0.0]
delivery_point:  [-1.5, -3.0, 0.0]
# 配送走安全走廊：先沿北侧走廊到 x=-1.5 的通道，再直下到配送点，
# 避免直线路径穿过地图未标注的桌子
delivery_route:
  - [-1.5, 3.0, -1.5708]
  - [-1.5, -3.0, 0.0]
# 回程走底部走廊：配送点 -> 底部 -> 起点
return_route:
  - [-1.5, -4.0, 0.0]
  - [-3.0, -4.0, 0.0]
pickup_points:
  cardboard_box: [-3.0, 3.0, -1.5708]
  wooden_board:  [0.0, 3.0, -1.5708]
  coke_can:      [3.0, 3.0, -1.5708]
patrol_points:
  - [-3.0, 3.0, -1.5708]
  - [0.0, 3.0, -1.5708]
  - [3.0, 3.0, -1.5708]
pick_duration: 2.0
place_duration: 2.0
patrol_wait: 6.0
nav_timeout: 150.0
auto_start_delay: 3.0
detect_confirm_frames: 3
detect_window: 8.0
